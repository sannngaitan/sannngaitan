<svg xmlns="http://www.w3.org/2000/svg" width="840" height="172" viewBox="0 0 840 172">
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --mute:#7d8590; --line:#30363d; --track:#21262d; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .num { fill: var(--fg); font-size: 34px; font-weight: 700; letter-spacing: -1px; }
  .lbl { fill: var(--fg); font-size: 14px; }
  .hint { fill: var(--mute); font-size: 12px; }
  .lang { fill: var(--fg); font-size: 13px; }
  .fade { opacity: 0; animation: in .6s ease-out forwards; }
  @keyframes in { to { opacity: 1; } }
  .grow { transform-origin: 470px 0; transform: scaleX(0); animation: grow 1s cubic-bezier(.2,.7,.2,1) .2s forwards; }
  @keyframes grow { to { transform: scaleX(1); } }
</style>
<rect x="0.5" y="0.5" width="839" height="171" rx="14" fill="var(--bg)" stroke="var(--line)"/>
<g class="fade" style="animation-delay:0.10s"><text x="40" y="74" class="num">0</text><text x="40" y="100" class="lbl">contribuciones</text><text x="40" y="120" class="hint">último año</text></g><g class="fade" style="animation-delay:0.22s"><text x="175" y="74" class="num">0</text><text x="175" y="100" class="lbl">racha actual</text><text x="175" y="120" class="hint">mejor: 0 días</text></g><g class="fade" style="animation-delay:0.34s"><text x="310" y="74" class="num">0</text><text x="310" y="100" class="lbl">repos</text><text x="310" y="120" class="hint">★ 0</text></g>
<line x1="440" y1="36" x2="440" y2="140" stroke="var(--line)"/>
<text x="470" y="38" class="hint">lenguajes</text>
<clipPath id="r"><rect x="470" y="52" width="330" height="8" rx="4"/></clipPath>
<rect x="470" y="52" width="330" height="8" rx="4" fill="var(--track)"/>
<g clip-path="url(#r)"><g class="grow"></g></g>
<text x="470" y="86" class="hint">todavía sin código público</text>
<text x="40" y="150" class="hint">actualizado 24/09/2026</text>
</svg>
