<svg xmlns="http://www.w3.org/2000/svg" width="600" height="272" viewBox="0 0 600 272">
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --mute:#7d8590; --line:#30363d; --track:#21262d; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .num { fill: var(--fg); font-size: 40px; font-weight: 700; letter-spacing: -1px; }
  .lbl { fill: var(--fg); font-size: 17px; }
  .hint { fill: var(--mute); font-size: 14px; }
  .lang { fill: var(--fg); font-size: 16px; }
  .fade { animation: in .6s ease-out both; }
  @keyframes in { from { opacity: 0; } }
  .grow { transform-origin: 32px 0; animation: grow 1s cubic-bezier(.2,.7,.2,1) .2s both; }
  @keyframes grow { from { transform: scaleX(0); } }
</style>
<rect x="0.5" y="0.5" width="599" height="271" rx="14" fill="var(--bg)" stroke="var(--line)"/>
<g class="fade" style="animation-delay:0.10s"><text x="32" y="72" class="num">0</text><text x="32" y="98" class="lbl">contribuciones</text><text x="32" y="118" class="hint">último año</text></g><g class="fade" style="animation-delay:0.22s"><text x="222" y="72" class="num">0</text><text x="222" y="98" class="lbl">racha</text><text x="222" y="118" class="hint">récord 0 días</text></g><g class="fade" style="animation-delay:0.34s"><text x="412" y="72" class="num">0</text><text x="412" y="98" class="lbl">repos</text><text x="412" y="118" class="hint">★ 0 estrellas</text></g>
<line x1="32" y1="142" x2="568" y2="142" stroke="var(--line)"/>
<text x="32" y="164" class="hint">lenguajes más usados</text>
<text x="568" y="164" class="hint" text-anchor="end">act. 24/09/2026</text>
<clipPath id="r"><rect x="32" y="176" width="536" height="10" rx="5"/></clipPath>
<rect x="32" y="176" width="536" height="10" rx="5" fill="var(--track)"/>
<g clip-path="url(#r)"><g class="grow"></g></g>
<text x="32" y="218" class="hint">todavía sin código público</text>
</svg>
