<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190">
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --mute:#656d76; --line:#d0d7de; --acc:#1f883d; }
    .mono { white-space: pre; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .prompt { fill: var(--mute); font-size: 16px; }
    .acc { fill: var(--acc); }
    .name { fill: var(--fg); font-size: 52px; font-weight: 700; letter-spacing: -1.5px; }
    .sub { fill: var(--mute); font-size: 17px; }
    .dot { fill: var(--line); }
    .reveal { animation: in .7s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: .5s; } .d2 { animation-delay: .8s; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } }
    .type { animation: type .9s steps(6) .1s both; }
    @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    .cursor { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect x="0.5" y="0.5" width="599" height="189" rx="14" fill="var(--bg)" stroke="var(--line)"/>
  <circle class="dot" cx="26" cy="24" r="5"/><circle class="dot" cx="44" cy="24" r="5"/><circle class="dot" cx="62" cy="24" r="5"/>
  <text x="32" y="70" class="mono prompt"><tspan class="acc">➜</tspan>  ~</text>
  <text x="84" y="70" class="mono prompt type">whoami</text>
  <text x="30" y="128" class="sans name reveal d1">Santiago Gaitán<tspan class="acc cursor" dx="3">_</tspan></text>
  <text x="32" y="162" class="mono sub reveal d2">estudiante de informatica · bs as, mar del plata</text>
</svg>
